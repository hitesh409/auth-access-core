<header class="navbar">
  <div class="navbar-left">
    @if (layoutService.isMobileView()) {
      <button type="button" class="btn-shell" (click)="toggleSidebar()">
        <i class="bi bi-list"></i>
      </button>
    }
    <div class="navbar-brand-section">
      <h1 class="navbar-title">Enterprise Access Platform</h1>
      <span class="navbar-subtitle"> Access Governance & Authorization </span>
    </div>
  </div>
  <div class="navbar-right">
    <div class="user-section">
      <div class="user-info">
        <div class="user-name">
          {{ fullName() }}
        </div>
        <div class="user-email">
          {{ email() }}
        </div>
      </div>
      <button type="button" class="btn-shell-action" (click)="logout()" [disabled]="isLoading()">
        @if (!isLoading()) {
          <i class="bi bi-box-arrow-right"></i>
          <span>Logout</span>
        } @else {
          <span class="spinner-border spinner-border-sm"> </span>
          <span>Logging out...</span>
        }
      </button>
    </div>
  </div>
</header>
