<header class="navbar">
  <div class="navbar-left">
    @if (layoutService.isMobileView()) {
      <app-button
        variant="navigation"
        [icon]="faBars"
        ariaLabel="Toggle sidebar"
        (click)="toggleSidebar()"
      ></app-button>
    }
    <div class="navbar-brand-section">
      <h1 class="navbar-title">Enterprise Access Platform</h1>
      <span class="navbar-subtitle"> Access Governance & Authorization </span>
    </div>
  </div>
  <div class="navbar-right">
    <div class="user-section">
      <div class="user-info">
        <div class="user-name">
          {{ fullName() }}
        </div>
        <div class="user-email">
          {{ email() }}
        </div>
      </div>
      <app-button
        variant="secondary"
        [icon]="faRightToBracket"
        [loading]="isLoading()"
        [disabled]="isLoading()"
        (click)="logout()"
      >
        {{ isLoading() ? 'Logging out...' : 'Logout' }}
      </app-button>
    </div>
  </div>
</header>
