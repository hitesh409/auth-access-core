<div class="accordion">
  @for (item of items(); track item.id) {
    <app-button variant="accordion" [active]="activeId() === item.id" (click)="toggle(item.id)">
      <div class="accordion__item">
        <div class="accordion__content">
          <div class="accordion__title">
            {{ item.title }}
          </div>

          @if (item.description) {
            <div class="accordion__description">
              {{ item.description }}
            </div>
          }
        </div>

        <fa-icon
          [icon]="icons.chevronDown"
          class="accordion__icon"
          [class.accordion__icon--active]="activeId() === item.id"
        >
        </fa-icon>
      </div>
    </app-button>
  }
</div>
