<div class="mb-5 text-center text-md-start">
    <h3 class="fw-bold text-dark"><fa-icon [icon]="['fas', 'key']"></fa-icon> Welcome Back</h3>
    <p class="text-muted small">Please enter your details to sign in.</p>
</div>

<form [formGroup]="loginForm" (ngSubmit)="onLogin()">
    <div class="form-floating mb-3">
        <input type="email" formControlName="email" class="form-control border-0 bg-light" id="emailInput"
            placeholder="name@example.com"
            [class.is-invalid]="submitted && loginForm.get('email')?.invalid && (!activeErrorField || activeErrorField === 'email')">
        <label for="emailInput" class="text-muted">Email Address</label>
    </div>

    <div class="form-floating mb-3 position-relative">
        <input [type]="hidePassword ? 'password' : 'text'" formControlName="password"
            class="form-control border-0 bg-light" id="passwordInput" placeholder="Password"
            [class.is-invalid]="submitted && loginForm.get('password')?.invalid && (!activeErrorField || activeErrorField === 'password')">
        <label for="passwordInput" class="text-muted">Password</label>
        <span class="position-absolute top-50 end-0 translate-middle-y me-3 cursor-pointer" (click)="togglePassword()">
            <fa-icon [icon]="hidePassword ? ['fas', 'eye-slash'] : ['fas', 'eye']"></fa-icon>
        </span>
    </div>

    <div class="d-flex justify-content-between align-items-center mb-4">
        <div class="form-check">
            <input class="form-check-input" type="checkbox" id="rememberMe">
            <label class="form-check-label small text-muted" for="rememberMe">Remember me</label>
        </div>
        <a routerLink="/auth/forgot-password" class="small text-primary text-decoration-none fw-semibold">Forgot
            Password?</a>
    </div>

    <app-button type="submit" variant="primary" size="lg" [block]="true" [disabled]="isLoading()">
        @if (!isLoading()) {
        <fa-icon [icon]="['fas', 'right-from-bracket']" class="me-2"></fa-icon>
        SIGN IN
        } @else {
        <span class="spinner-border spinner-border-sm me-2"></span>
        Signing in...
        }
    </app-button>
</form>

<div class="mt-5 text-center">
    <p class="small text-muted">Don't have an account? <a routerLink="/auth/register"
            class="text-primary fw-bold text-decoration-none">Sign Up</a></p>
</div>
