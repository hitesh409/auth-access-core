<div class="mb-5 text-center text-md-start">
    <h3 class="fw-bold text-dark"><fa-icon [icon]="['fas', 'user-shield']"></fa-icon> Forgot Password</h3>
    <p class="text-muted small">Enter your email to reset your password.</p>
</div>

<form [formGroup]="forgotPasswordForm" (ngSubmit)="onSubmit()">
    <div class="form-floating mb-4">
        <input type="email" class="form-control bg-light border-0" placeholder="Email" formControlName="email"
            [class.is-invalid]="submitted && forgotPasswordForm.get('email')?.invalid && (!activeErrorField || activeErrorField === 'email')">
        <label>Email Address</label>
    </div>

    <button type="submit" class="btn btn-primary w-100 py-3 fw-bold" [disabled]="isLoading()">
        @if (!isLoading()) {
        <span>Send Reset Link</span>
        } @else {
        <span>
            <span class="spinner-border spinner-border-sm me-2"></span>
            Sending...
        </span>
        }
    </button>
</form>

<div class="mt-4 text-center">
    <a routerLink="/auth/login" class="text-decoration-none fw-bold ">
        Back to Login
    </a>
</div>
